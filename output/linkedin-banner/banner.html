<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><title>LinkedIn Banner</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  @page { size: 1584px 396px; margin: 0; }
  body { width: 1584px; height: 396px; font-family: 'Inter', 'Helvetica Neue', Arial, sans-serif; overflow: hidden; background: #0b1d3a; }
  .banner {
    width: 1584px; height: 396px; position: relative;
    background: linear-gradient(135deg, #0b1d3a 0%, #122c5a 40%, #1d4ed8 100%);
    color: #fff;
    padding: 56px 96px;
    display: flex; flex-direction: column; justify-content: center;
  }
  .banner::before {
    content: ''; position: absolute; top: 0; right: 0; width: 600px; height: 100%;
    background: radial-gradient(circle at 70% 50%, rgba(56,189,248,0.25), transparent 60%);
  }
  .banner::after {
    content: ''; position: absolute; bottom: 0; left: 0; width: 100%; height: 4px;
    background: linear-gradient(90deg, #38bdf8 0%, #fbbf24 50%, #f97316 100%);
  }
  .tag {
    font-size: 18px; font-weight: 600; letter-spacing: 6px; text-transform: uppercase;
    color: #38bdf8; margin-bottom: 14px;
  }
  .h1 {
    font-size: 56px; font-weight: 800; line-height: 1.05; letter-spacing: -0.5px;
    margin-bottom: 28px; max-width: 1100px;
  }
  .h1 .accent { color: #fbbf24; }
  .stats {
    display: flex; gap: 64px; margin-bottom: 24px;
  }
  .stat { display: flex; flex-direction: column; }
  .stat .num { font-size: 36px; font-weight: 800; color: #fff; letter-spacing: -0.5px; line-height: 1; }
  .stat .lbl { font-size: 14px; font-weight: 500; color: #cbd5e1; margin-top: 6px; letter-spacing: 0.5px; text-transform: uppercase; }
  .stat .num.green { color: #4ade80; }
  .stat .num.amber { color: #fbbf24; }
  .stat .num.cyan { color: #38bdf8; }
  .url {
    font-size: 17px; font-weight: 600; color: #e2e8f0;
    position: absolute; bottom: 32px; right: 96px;
    letter-spacing: 0.5px;
  }
  .url span { color: #fbbf24; }
</style></head>
<body>
<div class="banner">
  <div class="tag">Growth &nbsp;|&nbsp; Product Marketing &nbsp;|&nbsp; Pricing</div>
  <div class="h1">Turning <span class="accent">marketing spend</span> into measurable revenue, margin, and product growth.</div>
  <div class="stats">
    <div class="stat"><span class="num green">$627M</span><span class="lbl">Margin Dashboard</span></div>
    <div class="stat"><span class="num amber">16x</span><span class="lbl">Peak ROAS</span></div>
    <div class="stat"><span class="num cyan">-25%</span><span class="lbl">CPA Reduction</span></div>
    <div class="stat"><span class="num">+12%</span><span class="lbl">YoY Revenue</span></div>
  </div>
  <div class="url">adhithyabhaskar<span>.vercel.app</span></div>
</div>
</body></html>
