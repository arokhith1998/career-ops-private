# Portal Scanner Config — Adhithya Rokhith Bhaskar
# Target: Growth / Performance Marketing / Product Marketing / Product Mgmt / Pricing
# Seniority: 0–5 YoE. Visa: STEM OPT (needs H-1B sponsorship).

title_filter:
  positive:
    # Growth & performance marketing
    - "Growth Manager"
    - "Growth Marketing"
    - "Performance Marketing"
    - "Paid Media"
    - "Paid Search"
    - "Paid Social"
    - "SEM"
    - "SEO"
    - "Search Engine Marketing"
    - "Search Engine Optimization"
    - "Programmatic"
    - "Media Buyer"
    - "Media Planner"
    - "Digital Marketing"
    - "Acquisition Marketing"
    - "Lifecycle Marketing"
    - "CRM Marketing"
    - "Email Marketing"
    # Product / brand / content
    - "Product Marketing"
    - "PMM"
    - "Content Marketing"
    - "Content Manager"
    - "Social Media Manager"
    - "Brand Marketing"
    - "Brand Manager"
    - "Marketing Manager"
    - "Marketing Analyst"
    - "Marketing Analytics"
    - "Marketing Operations"
    # Product management
    - "Product Manager"
    - "Associate Product Manager"
    - "APM"
    - "Product Analyst"
    - "Product Owner"
    # Pricing
    - "Pricing"
    - "Pricing Analyst"
    - "Pricing Manager"
    - "Pricing Strategy"
    - "Revenue Management"
    - "Monetization"
    - "Deal Desk"
    # RevOps (US track, added 2026-09-18)
    - "Revenue Operations"
    - "RevOps"
    - "Rev Ops"
    - "GTM Operations"
    - "Sales Operations"
    # Strategic marketing / market strategy (US track)
    - "Strategic Marketing"
    - "Marketing Strategy"
    - "Market Strategy"
    - "Market Intelligence"
    - "Competitive Intelligence"
    - "Market Research"
    - "Go-to-Market"
    # India track (added 2026-09-18). config/nightly.yml -> tracks keeps these
    # to India and the US titles to the Bay Area / Remote-US.
    - "Chief of Staff"
    - "Head of Growth"
    - "Growth Head"
  negative:
    - "Intern"
    - "Director"
    - "VP"
    - "Vice President"
    - "Principal"
    - "Staff"
    - "SDR"
    - "BDR"
    - "Sales Development"
    - "Account Executive"
    - "Software Engineer"
    - "Backend"
    - "Frontend"
    - "Full Stack"
    - "DevOps"
    - "iOS"
    - "Android"
    - "Embedded"
  seniority_boost:
    - "Associate"
    - "Manager"
    - "Senior"
    - "Lead"

search_queries:
  - name: Greenhouse — Growth & Performance Marketing
    query: 'site:boards.greenhouse.io OR site:job-boards.greenhouse.io "Growth Marketing" OR "Performance Marketing" OR "Paid Media" OR "SEM"'
    enabled: true
  - name: Greenhouse — Product Marketing
    query: 'site:boards.greenhouse.io OR site:job-boards.greenhouse.io "Product Marketing Manager" OR "PMM"'
    enabled: true
  - name: Greenhouse — Product Manager (APM)
    query: 'site:boards.greenhouse.io OR site:job-boards.greenhouse.io "Associate Product Manager" OR "APM" OR "Product Analyst"'
    enabled: true
  - name: Greenhouse — Pricing
    query: 'site:boards.greenhouse.io OR site:job-boards.greenhouse.io "Pricing Analyst" OR "Pricing Manager" OR "Pricing Strategy"'
    enabled: true
  - name: Lever — Marketing
    query: 'site:jobs.lever.co "Growth Marketing" OR "Performance Marketing" OR "Product Marketing" OR "SEM" OR "Pricing"'
    enabled: true
  - name: Ashby — Marketing
    query: 'site:jobs.ashbyhq.com "Growth Marketing" OR "Performance Marketing" OR "Product Marketing" OR "Paid Media"'
    enabled: true
  - name: Greenhouse — RevOps & Market Strategy
    query: 'site:boards.greenhouse.io OR site:job-boards.greenhouse.io "Revenue Operations" OR "Deal Desk" OR "Competitive Intelligence" OR "Market Strategy"'
    enabled: true
  - name: LinkedIn — Bay Area Pricing & PMM
    query: 'site:linkedin.com/jobs "Pricing Manager" OR "Product Marketing Manager" OR "Revenue Operations" "San Francisco Bay Area"'
    enabled: true
  - name: India — Chief of Staff
    query: 'site:linkedin.com/jobs OR site:jobs.lever.co OR site:boards.greenhouse.io "Chief of Staff" India OR Bengaluru OR Mumbai OR Gurugram'
    enabled: true
  - name: India — Head of Growth
    query: 'site:linkedin.com/jobs OR site:jobs.lever.co OR site:boards.greenhouse.io "Head of Growth" India OR Bengaluru OR Mumbai OR Gurugram'
    enabled: true
  - name: LinkedIn — Boston Marketing
    query: 'site:linkedin.com/jobs "Growth Manager" OR "Performance Marketing" Boston'
    enabled: false   # Boston is no longer a target metro (2026-09-18)
  - name: Pharma Marketing
    query: '"Product Marketing" OR "Brand Manager" OR "Digital Marketing" pharma OR biotech'
    enabled: true
  - name: Energy / Oil Marketing & Pricing
    query: '"Pricing Analyst" OR "Marketing Manager" energy OR oil OR utilities OR industrial'
    enabled: true

